<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Masuk BPA</title>

    <link rel="icon" href="/app.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css?v=20261119-62">
</head>

<body>

    <main class="login-page login-page--unified">

        <div class="login-card login-card--unified">

            <aside class="login-brand-panel" aria-label="Identiti BPA">
                <div class="login-brand-identity">
                    <div class="login-brand-logo login-brand-logo--wordmark">
                        <img src="/logo-bpa.png?v=20261111-2" alt="MAIWP — Majlis Agama Islam Wilayah Persekutuan">
                    </div>
                    <p class="login-brand-eyebrow">MAIWP</p>
                    <h2>Sistem BPA</h2>
                    <p class="login-brand-description">Bahagian Pembangunan Asnaf MAIWP.</p>
                </div>
                <div class="login-brand-products" aria-label="BPA">
                    <span class="login-brand-product login-brand-product--bpa">BPA</span>
                </div>
                <div class="login-brand-stripe" aria-hidden="true"><span></span><span></span><span></span></div>
            </aside>

            <div class="login-form-panel">
                <div class="login-header">
                    <span class="login-form-kicker">SISTEM BPA</span>
                    <h1>Log Masuk</h1>
                    <p>Log masuk ke sistem Bahagian Pembangunan Asnaf.</p>
                </div>

                <div id="message" class="message" hidden></div>

                <section id="accountSelection" class="login-section" hidden>

                    <h2>Pilih Profil</h2>

                    <p class="section-description">
                        Pilih profil yang pernah digunakan pada komputer ini.
                    </p>

                    <div id="accountList" class="account-list"></div>

                    <button type="button" id="showLoginButton" class="secondary-button">
                        Gunakan Profil Lain
                    </button>

                </section>

                <section id="loginFormSection" class="login-section">

                    <form id="loginForm" autocomplete="off">

                        <div class="form-group">

                            <label for="username">
                                Username atau E-mel
                                <small class="username-help" hidden>Username tidak boleh mengandungi ruang.</small>
                            </label>

                            <input type="text" id="username" name="username" placeholder="Masukkan username atau e-mel"
                                autocomplete="username" autocapitalize="none" spellcheck="false" required>

                        </div>

                        <div class="form-group">

                            <label for="password">
                                Kata Laluan
                            </label>

                            <input type="password" id="password" name="password" placeholder="Masukkan kata laluan"
                                autocomplete="current-password" required>

                        </div>

                        <button type="submit" id="loginButton" class="primary-button">
                            Log Masuk
                        </button>

                    </form>

                    <div class="back-login">
                        <a href="/cipta-akaun">Pengguna baharu? Cipta profil</a>
                    </div>

                    <button type="button" id="backToAccountsButton" class="secondary-button" hidden>
                        Kembali
                    </button>
                </section>
            </div>

        </div>

    </main>

    <script src="/js/auth-transition.js?v=20261119-9"></script>
    <script src="/js/confirmation-dialog.js?v=20261119-1"></script>
    <script src="/js/login.js?v=20261119-4"></script>

</body>

</html>
