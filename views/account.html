<main class="main-content">
    <div class="dashboard-content account-page">
        <header class="recipient-participant-title audit-page-title">
            <div class="recipient-participant-title-copy">
                <h4>Profil Pengguna</h4>
                <p>Kemas kini maklumat profil atau kata laluan anda.</p>
            </div>
        </header>

        <div class="manage-users-layout account-layout">
        <section class="content-card account-settings-card manage-users-card account-profile-card">
            <div class="card-header-custom account-settings-header">
                <div>
                    <h5>Maklumat Profil</h5>
                    <span>Butiran akaun dan tetapan kata laluan.</span>
                </div>
            </div>

            <div class="account-settings-body">
                <form id="accountSettingsForm" data-csrf-token="__APP_CSRF_TOKEN__">
                    <div class="managed-user-form-layout">
                        <div class="managed-user-form-avatar" id="accountSettingsAvatar" aria-hidden="true">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div class="managed-user-form-content">
                            <div class="manage-user-fields account-profile-fields">
                                <div class="form-field account-profile-display-name">
                                    <label for="accountDisplayName">Nama Pengguna</label>
                                    <input type="text" id="accountDisplayName" maxlength="160" autocomplete="name" required>
                                </div>

                                <div class="form-field">
                                    <label for="accountUsername">Username</label>
                                    <input type="text" id="accountUsername" autocomplete="username" readonly>
                                </div>

                                <div class="form-field">
                                    <label for="accountEmail">E-mel</label>
                                    <input type="email" id="accountEmail" maxlength="254" autocomplete="email">
                                </div>

                                <div class="form-field account-profile-unit">
                                    <label for="accountUnit">Unit</label>
                                    <input type="text" id="accountUnit" autocomplete="off" readonly>
                                </div>

                                <div class="account-password-section account-profile-password">
                                    <h5>Tukar Kata Laluan</h5>
                                    <p>Biarkan ruangan kata laluan kosong jika anda tidak mahu menukarnya.</p>

                                    <div class="form-field">
                                        <label for="accountCurrentPassword">Kata Laluan Semasa</label>
                                        <input type="password" id="accountCurrentPassword" autocomplete="current-password">
                                    </div>

                                    <div class="form-field">
                                        <label for="accountNewPassword">Kata Laluan Baharu</label>
                                        <input type="password" id="accountNewPassword" autocomplete="new-password">
                                    </div>

                                    <div class="form-field">
                                        <label for="accountConfirmPassword">Sahkan Kata Laluan Baharu</label>
                                        <input type="password" id="accountConfirmPassword" autocomplete="new-password">
                                    </div>
                                </div>
                            </div>

                            <div id="accountSettingsMessage" class="message" role="status" aria-live="polite" hidden></div>

                            <div class="form-actions">
                                <button type="submit" id="accountSaveButton" data-permission-edit="account"
                                    class="budget-list-action bpa-budget-save-button account-save-button" disabled>
                                    <span class="budget-list-action-icon"><i class="bi bi-check2" aria-hidden="true"></i></span>
                                    <span>Simpan Perubahan</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>
        <section class="content-card account-user-log-card" aria-labelledby="accountUserLogTitle">
            <div class="card-header-custom account-settings-header">
                <div>
                    <h5 id="accountUserLogTitle">Log Pengguna</h5>
                    <span>Tindakan anda dalam aplikasi.</span>
                </div>
            </div>
            <div class="account-user-log-list" id="accountUserLogList" role="list" tabindex="0">
                <div class="managed-user-list-empty">Memuatkan log...</div>
            </div>
        </section>
        </div>
    </div>
</main>
