<!DOCTYPE html>
<html lang="ms" class="create-account-document">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cipta Profil</title>

    <link rel="icon" href="/app.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css?v=20261119-59">
</head>

<body class="create-account-document">

    <div class="create-account-page create-account-page--unified">

        <div class="create-account-card create-account-card--unified">

            <aside class="login-brand-panel create-account-brand-panel" aria-label="Identiti BPA">
                <div class="login-brand-identity">
                    <div class="login-brand-logo login-brand-logo--wordmark">
                        <img src="/logo-bpa.png?v=20261111-2" alt="MAIWP — Majlis Agama Islam Wilayah Persekutuan">
                    </div>
                    <p class="login-brand-eyebrow">MAIWP</p>
                    <h2>Sistem BPA</h2>
                    <p class="login-brand-description">Bahagian Pembangunan Asnaf MAIWP.</p>
                </div>
                <div class="login-brand-products" aria-label="BPA">
                    <span class="login-brand-product login-brand-product--bpa">BPA</span>
                </div>
                <div class="login-brand-stripe" aria-hidden="true"><span></span><span></span><span></span></div>
            </aside>

            <div class="create-account-form-panel">
                <div class="create-account-header">
                    <span class="login-form-kicker">SISTEM BPA</span>
                    <h2>Cipta Profil</h2>
                    <p>Cipta profil pengguna Bahagian Pembangunan Asnaf.</p>
                </div>

                <form id="createAccountForm">

                    <div class="form-group">
                        <label for="displayName">Nama Pengguna</label>
                        <input type="text" id="displayName" name="displayName" class="form-control"
                            placeholder="Masukkan nama pengguna" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username
                            <small class="username-help" hidden>Huruf kecil, nombor, titik (.) dan garis bawah (_).</small>
                        </label>

                        <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username"
                            autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-z0-9._]+"
                            title="Gunakan huruf kecil, nombor, titik (.) dan garis bawah (_)." required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mel</label>
                        <input type="email" id="email" name="email" class="form-control" maxlength="254"
                            placeholder="Masukkan e-mel" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Laluan</label>

                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Masukkan kata laluan" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Sahkan Kata Laluan</label>

                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                            placeholder="Sahkan kata laluan" autocomplete="new-password" required>
                    </div>

                    <div id="message" class="message" hidden></div>

                    <button type="submit" id="createAccountButton" class="btn btn-primary w-100">
                        Cipta Profil
                    </button>
                </form>

                <div class="back-login">
                    <a href="/log-masuk">Kembali ke Log Masuk</a>
                </div>
            </div>

        </div>

    </div>

    <script src="/js/auth-transition.js?v=20261119-9"></script>
    <script src="/js/create-account.js?v=20261126-7"></script>

</body>

</html>
