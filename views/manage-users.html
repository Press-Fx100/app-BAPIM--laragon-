<main class="main-content">
    <div class="dashboard-content account-page manage-users-page">
        <div class="manage-users-layout">
        <section class="content-card account-settings-card manage-users-card">
            <div class="card-header-custom account-settings-header">
                <div>
                    <h5>Pengurusan Pengguna</h5>
                    <span>Cipta dan kemas kini akaun pengguna sistem.</span>
                </div>
                <button type="button" class="dataset-upload-close managed-user-add-button"
                    id="newManagedUserButton" title="Tambah Pengguna" aria-label="Tambah Pengguna">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                </button>
            </div>

            <div class="account-settings-body">
                <form id="managedUserForm" data-csrf-token="__APP_CSRF_TOKEN__" novalidate>
                    <div class="managed-user-form-layout">
                        <div class="managed-user-form-avatar" id="managedUserFormAvatar" aria-hidden="true">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <div class="managed-user-form-content">
                            <div class="manage-user-fields">
                                <div class="form-field">
                                    <label for="managedUsername">Nama Pengguna
                                        <small class="username-help" hidden>Huruf kecil, nombor dan titik (.) sahaja.</small>
                                    </label>
                                    <input type="text" id="managedUsername" maxlength="100" autocomplete="off"
                                        autocapitalize="none" spellcheck="false" pattern="[a-z0-9.]+"
                                        title="Gunakan huruf kecil, nombor dan titik (.) sahaja." required>
                                </div>
                                <div class="form-field">
                                    <label for="managedDisplayName">Nama Paparan</label>
                                    <input type="text" id="managedDisplayName" maxlength="160" autocomplete="name" required>
                                </div>
                                <div class="form-field">
                                    <label for="managedPassword">Kata Laluan
                                        <span class="username-help" id="managedPasswordHint"></span>
                                    </label>
                                    <input type="password" id="managedPassword" autocomplete="new-password">
                                </div>
                                <div class="form-field">
                                    <label for="managedAccessLevel">Tahap Akses</label>
                                    <div class="managed-access-field-controls">
                                        <select id="managedAccessLevel" required>
                                            <option value="0">0 - Dev (akses penuh)</option>
                                            <option value="1">1 - Admin (urus pengguna)</option>
                                            <option value="2" selected>2 - Editor (sunting dan muat naik)</option>
                                            <option value="3">3 - Viewer (paparan sahaja)</option>
                                        </select>
                                        <button type="button" class="btn btn-outline-primary managed-access-config-button"
                                            id="configureManagedAccessButton" title="Kebenaran Akses"
                                            aria-label="Kebenaran Akses">
                                            <i class="bi bi-pencil-square" aria-hidden="true"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div id="managedUserMessage" class="message" role="status" aria-live="polite" hidden></div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-outline-danger" id="managedUserStatusButton" hidden></button>
                                <button type="submit" class="btn btn-primary" id="saveManagedUserButton">Tambah Pengguna</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="content-card managed-users-list-card">
            <div class="search-toolbar-group managed-users-controls">
                <div class="search-box">
                    <input type="text" id="managedUserSearch" placeholder="Cari nama pengguna..."
                        aria-label="Cari nama paparan atau nama pengguna" autocomplete="off">
                </div>
                <div class="toolbar-group toolbar-control-cluster">
                    <div class="filter-menu-wrapper managed-users-filter-wrapper">
                        <button type="button" id="managedUserFilterButton" class="toolbar-button icon-button"
                            title="Tapis mengikut tahap akses" aria-controls="managedUserFilterMenu"
                            aria-expanded="false">
                            <i class="bi bi-funnel" aria-hidden="true"></i>
                        </button>
                        <div class="filter-menu managed-users-filter-menu" id="managedUserFilterMenu">
                            <label class="managed-users-filter-option">
                                <input type="radio" name="managedUserAccessFilter" value="" checked>
                                <span>Semua tahap</span>
                            </label>
                            <label class="managed-users-filter-option">
                                <input type="radio" name="managedUserAccessFilter" value="0">
                                <span>Dev (akses penuh)</span>
                            </label>
                            <label class="managed-users-filter-option">
                                <input type="radio" name="managedUserAccessFilter" value="1">
                                <span>Admin (urus pengguna)</span>
                            </label>
                            <label class="managed-users-filter-option">
                                <input type="radio" name="managedUserAccessFilter" value="2">
                                <span>Editor (sunting dan muat naik)</span>
                            </label>
                            <label class="managed-users-filter-option">
                                <input type="radio" name="managedUserAccessFilter" value="3">
                                <span>Viewer (paparan sahaja)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="managed-users-list" id="managedUsersBody" role="list"
                aria-label="Senarai pengguna">
                <div class="managed-user-list-empty">Memuatkan pengguna...</div>
            </div>
        </section>
        </div>
    </div>

    <div class="managed-user-access-overlay" id="managedUserAccessOverlay" hidden>
        <section class="managed-user-access-modal" id="managedUserAccessModal" role="dialog" aria-modal="true"
            aria-labelledby="managedUserAccessTitle">
            <header class="managed-user-access-header">
                <div>
                    <h5 id="managedUserAccessTitle">Kebenaran Akses</h5>
                    <p>Pilih halaman yang boleh dibuka dan sama ada pengguna boleh membuat perubahan.</p>
                </div>
                <button type="button" class="managed-user-access-close" id="closeManagedUserAccess" aria-label="Tutup">×</button>
            </header>
            <div class="managed-user-access-list" id="managedUserAccessList"></div>
            <div class="managed-user-access-error" id="managedUserAccessError" role="alert" hidden></div>
            <div class="managed-user-access-actions">
                <button type="button" class="btn btn-outline-secondary" id="cancelManagedUserAccess">Batal</button>
                <button type="button" class="btn btn-primary" id="saveManagedUserAccess">Simpan Kebenaran</button>
            </div>
        </section>
    </div>
</main>
