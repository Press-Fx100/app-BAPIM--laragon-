<header class="topbar">
    <div class="topbar-leading">
        <img class="header-logo" src="/logo.png" alt="Logo MAIWP">
    </div>

    <div class="topbar-context">
        <div class="page-breadcrumb" id="pageBreadcrumb">SISTEM PENGURUSAN DATA</div>
        <h1 class="page-title" id="pageTitle">Papan Pemuka</h1>
    </div>

    <div class="topbar-right">
        <div class="user-dropdown" id="userDropdown">

            <button type="button" class="user-dropdown-button" id="userDropdownButton"
                aria-expanded="false" aria-controls="userDropdownMenu">
                <div class="user-avatar" id="userIcon">
                    <i class="bi bi-person-fill" aria-hidden="true"></i>
                </div>

                <div class="user-details">
                    <div class="user-display-name" id="userDisplayName">
                        Tester
                    </div>

                    <div class="user-username" id="userName">
                        f
                    </div>
                </div>

            </button>

            <div class="user-dropdown-menu" id="userDropdownMenu" aria-hidden="true">
                <button type="button" class="dropdown-item" id="manageUsersButton" data-access-page="manageUsers" hidden>
                    <i class="bi bi-people" aria-hidden="true"></i>
                    <span>Pengurusan Pengguna</span>
                </button>

                <button type="button" class="dropdown-item" id="accountButton" data-access-page="account">
                    <i class="bi bi-person-gear" aria-hidden="true"></i>
                    <span>Akaun Pengguna</span>
                </button>

                <button type="button" class="dropdown-item" id="updatesButton" data-access-page="updates">
                    <i class="bi bi-journal-text" aria-hidden="true"></i>
                    <span>Log Perisian</span>
                </button>

                <button type="button" class="dropdown-item logout-item" id="logoutButton">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    <span>Log Keluar</span>
                </button>
            </div>

        </div>
    </div>
</header>
